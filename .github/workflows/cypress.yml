name: Cypress

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  cypress-smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -e .

      - name: Start application server
        run: |
          uvicorn src.main:app --host 0.0.0.0 --port 8001 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8001/health && break
            echo "Waiting for server... ($i)"
            sleep 2
          done

      - name: Cypress smoke run
        uses: cypress-io/github-action@v7
        with:
          working-directory: cypress
          spec: e2e/smoke.cy.js
          wait-on: "http://localhost:8001/health"
          wait-on-timeout: 60

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-smoke-screenshots
          path: cypress/screenshots
          retention-days: 7

  cypress-a11y:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -e .

      - name: Start application server
        run: |
          uvicorn src.main:app --host 0.0.0.0 --port 8001 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8001/health && break
            echo "Waiting for server... ($i)"
            sleep 2
          done

      - name: Cypress a11y run
        uses: cypress-io/github-action@v7
        with:
          working-directory: cypress
          spec: e2e/accessibility.cy.js
          wait-on: "http://localhost:8001/health"
          wait-on-timeout: 60

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-a11y-screenshots
          path: cypress/screenshots
          retention-days: 7
