name: Cypress

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  cypress-smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and start application
        run: |
          docker compose up --build -d
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            echo "Waiting for server... ($i)"
            sleep 2
          done

      - name: Wait for initial data scrape
        run: |
          for i in $(seq 1 30); do
            count=$(curl -sf http://localhost:8000/api/v1/events | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
            [ "$count" -gt 0 ] && echo "Data ready ($count events)" && break
            echo "Waiting for scrape... ($i)"
            sleep 5
          done

      - name: Cypress smoke run
        uses: cypress-io/github-action@v7
        with:
          working-directory: cypress
          spec: e2e/smoke.cy.js
          wait-on: "http://localhost:8000/health"
          wait-on-timeout: 60

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-smoke-screenshots
          path: cypress/screenshots
          retention-days: 7

  cypress-a11y:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and start application
        run: |
          docker compose up --build -d
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            echo "Waiting for server... ($i)"
            sleep 2
          done

      - name: Wait for initial data scrape
        run: |
          for i in $(seq 1 30); do
            count=$(curl -sf http://localhost:8000/api/v1/events | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
            [ "$count" -gt 0 ] && echo "Data ready ($count events)" && break
            echo "Waiting for scrape... ($i)"
            sleep 5
          done

      - name: Cypress a11y run
        uses: cypress-io/github-action@v7
        with:
          working-directory: cypress
          spec: e2e/accessibility.cy.js
          wait-on: "http://localhost:8000/health"
          wait-on-timeout: 60

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-a11y-screenshots
          path: cypress/screenshots
          retention-days: 7
