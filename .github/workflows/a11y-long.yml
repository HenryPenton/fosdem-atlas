name: Accessibility (full)

on:
  workflow_dispatch: # Allow manual trigger

jobs:
  cypress-a11y-long:
    name: Full Accessibility Audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and start application
        run: |
          docker compose up --build -d
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            echo "Waiting for server... ($i)"
            sleep 2
          done

      - name: Wait for initial data scrape
        # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell
        run: |
          for i in $(seq 1 30); do
            count=$(curl -sf http://localhost:8000/api/v1/events | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
            [ "$count" -gt 0 ] && echo "Data ready ($count events)" && break
            echo "Waiting for scrape... ($i)"
            sleep 5
          done

      - name: Full a11y audit
        uses: cypress-io/github-action@0ed14f5d30c4ad6e5e8ffb6f57dbb69150137a3f # v7.4.10
        with:
          working-directory: cypress
          spec: e2e/a11y-long.cy.js
          wait-on: "http://localhost:8000/health"
          wait-on-timeout: 60
          config: defaultCommandTimeout=15000

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: a11y-long-screenshots
          path: cypress/screenshots
          retention-days: 14
