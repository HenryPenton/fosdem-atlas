name: Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  close-stale-issues:
    name: Close Previous Scan Issues
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close previous security scan issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue list \
            --state open \
            --label ci-auto-generated-security-report \
            --json number --jq '.[].number' | \
          while read -r num; do
            gh issue close "$num" \
              --comment "Auto-closed: superseded by security scan run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/default \
            --config p/python \
            --config p/owasp-top-ten \
            --json --output semgrep.json
          # Also produce human-readable text for summary
          semgrep scan \
            --config p/default \
            --config p/python \
            --config p/owasp-top-ten \
            --text 2>&1 | tee semgrep-output.txt || true
          {
            echo "## Semgrep SAST Results"
            echo '```'
            cat semgrep-output.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: semgrep-report
          path: |
            semgrep.json
            semgrep-output.txt

  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate requirements.txt for Trivy
        run: pip install -e ".[dev]" --quiet && pip freeze > requirements.txt

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          format: table
          output: trivy-report.txt
          exit-code: "1"

      - name: Write Trivy summary
        if: always()
        run: |
          {
            echo "## Trivy Scan Results (vuln, secret, misconfig)"
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload Trivy report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  zap:
    name: ZAP DAST Baseline Scan
    needs: [close-stale-issues]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install . --quiet

      - name: Start application
        run: |
          uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            echo "Waiting for server... ($i)"
            sleep 2
          done

      - name: Wait for initial data scrape
        run: |
          for i in $(seq 1 30); do
            count=$(curl -sf http://localhost:8000/api/v1/events | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
            [ "$count" -gt 0 ] && echo "Data ready ($count events)" && break
            echo "Waiting for scrape... ($i)"
            sleep 5
          done

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: "http://localhost:8000"
          rules_file_name: ".zap/rules.tsv"
          fail_action: false
          artifact_name: zap-report

      - name: Label ZAP issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue list --state open --author "app/github-actions" \
            --search "ZAP Scan Baseline Report" --json number --jq '.[].number' | \
          while read -r num; do
            gh issue edit "$num" --add-label "ci-auto-generated-security-report" 2>/dev/null || true
          done

      - name: Write ZAP summary
        if: always()
        run: |
          if [ -f report_html.html ]; then
            echo "## ZAP DAST Baseline Results" >> $GITHUB_STEP_SUMMARY
            echo "See the uploaded **zap-report** artifact for full details." >> $GITHUB_STEP_SUMMARY
          fi
