name: Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Run Semgrep
        run: |
          uvx semgrep scan \
            --config p/default \
            --config p/python \
            --config p/owasp-top-ten \
            --json --output semgrep.json
          # Also produce human-readable text for summary
          uvx semgrep scan \
            --config p/default \
            --config p/python \
            --config p/owasp-top-ten \
            --text 2>&1 | tee semgrep-output.txt || true
          {
            echo "## Semgrep SAST Results"
            echo '```'
            cat semgrep-output.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: semgrep-report
          path: |
            semgrep.json
            semgrep-output.txt

  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Generate requirements.txt for Trivy
        run: uv export --frozen --extra dev --no-emit-project --no-hashes -o requirements.txt

      - name: Run Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          format: table
          output: trivy-report.txt
          exit-code: "1"

      - name: Write Trivy summary
        if: always()
        run: |
          {
            echo "## Trivy Scan Results (vuln, secret, misconfig)"
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload Trivy report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  zap:
    name: ZAP DAST Baseline Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Start application
        run: |
          uv run --frozen uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            echo "Waiting for server... ($i)"
            sleep 2
          done

      - name: Wait for initial data scrape
        # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell
        run: |
          for i in $(seq 1 30); do
            count=$(curl -sf http://localhost:8000/api/v1/events | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
            [ "$count" -gt 0 ] && echo "Data ready ($count events)" && break
            echo "Waiting for scrape... ($i)"
            sleep 5
          done

      - name: Run ZAP Baseline Scan
        run: |
          mkdir -p reports .zap/reports
          chmod -R 777 .zap/reports
          # Rewrite target URL for CI (no host.docker.internal needed on Linux)
          sed 's|host\.docker\.internal|172.17.0.1|g' .zap/zap.yaml > .zap/zap-ci.yaml
          docker run --rm \
            -v ${{ github.workspace }}/.zap:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -autorun /zap/wrk/zap-ci.yaml
          # Copy reports to workspace reports/
          cp -f .zap/reports/zap-report.* reports/ 2>/dev/null || true

      - name: Upload ZAP report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: zap-report
          path: |
            reports/zap-report.*
            .zap/reports/zap-report.*

      - name: Write ZAP summary
        if: always()
        run: |
          if [ -f reports/zap-report.html ]; then
            echo "## ZAP DAST Baseline Results" >> $GITHUB_STEP_SUMMARY
            echo "See the uploaded **zap-report** artifact for full details." >> $GITHUB_STEP_SUMMARY
          fi
