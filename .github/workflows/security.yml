name: Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/default \
            --config p/python \
            --config p/owasp-top-ten \
            --json --output semgrep.json
          # Also produce human-readable text for summary
          semgrep scan \
            --config p/default \
            --config p/python \
            --config p/owasp-top-ten \
            --text 2>&1 | tee semgrep-output.txt || true
          {
            echo "## Semgrep SAST Results"
            echo '```'
            cat semgrep-output.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: semgrep-report
          path: |
            semgrep.json
            semgrep-output.txt

  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          format: table
          output: trivy-table.txt
        continue-on-error: true

      - name: Write Trivy summary
        if: always()
        run: |
          {
            echo "## Trivy Vulnerability Results"
            echo '```'
            cat trivy-table.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload Trivy report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: trivy-report
          path: trivy-table.txt

  trufflehog:
    name: TruffleHog Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      - name: Run TruffleHog
        run: |
          trufflehog filesystem . --only-verified --json > trufflehog-report.json 2>/dev/null || true
          # Each finding is one JSON line; log lines have a "level" key, findings have a "DetectorName" key
          FINDINGS=$(grep '"DetectorName"' trufflehog-report.json 2>/dev/null | wc -l)
          {
            echo "## TruffleHog Secrets Scan Results"
            if [ "$FINDINGS" -eq 0 ]; then
              echo "No verified secrets found. ✅"
            else
              echo "⚠️ **$FINDINGS verified secret(s) found:**"
              echo '```json'
              grep '"DetectorName"' trufflehog-report.json
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload TruffleHog report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: trufflehog-report
          path: trufflehog-report.json
