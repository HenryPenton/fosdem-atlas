name: Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/default \
            --config p/python \
            --config p/owasp-top-ten \
            --sarif --output semgrep.sarif \
            --text 2>&1 | tee semgrep-output.txt
          echo "## Semgrep SAST Results" >> $GITHUB_STEP_SUMMARY
          cat semgrep-output.txt >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: semgrep-report
          path: |
            semgrep.sarif
            semgrep-output.txt

  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy (table output for summary)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table
          output: trivy-table.txt
        continue-on-error: true

      - name: Run Trivy (JSON for artifact)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: json
          output: trivy.json
        continue-on-error: true

      - name: Write Trivy summary
        if: always()
        run: |
          echo "## Trivy Vulnerability Results" >> $GITHUB_STEP_SUMMARY
          cat trivy-table.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload Trivy report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: trivy-report
          path: |
            trivy-table.txt
            trivy.json

  trufflehog:
    name: TruffleHog Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      - name: Run TruffleHog
        run: |
          trufflehog filesystem . --only-verified --json > trufflehog-report.json 2>&1 || true
          echo "## TruffleHog Secrets Scan Results" >> $GITHUB_STEP_SUMMARY
          COUNT=$(wc -l < trufflehog-report.json | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "No verified secrets found. ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ $COUNT verified secret(s) found. See artifact for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload TruffleHog report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: trufflehog-report
          path: trufflehog-report.json
