name: Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/default \
            --config p/python \
            --config p/owasp-top-ten \
            --json --output semgrep.json
          # Also produce human-readable text for summary
          semgrep scan \
            --config p/default \
            --config p/python \
            --config p/owasp-top-ten \
            --text 2>&1 | tee semgrep-output.txt || true
          {
            echo "## Semgrep SAST Results"
            echo '```'
            cat semgrep-output.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semgrep-report
          path: |
            semgrep.json
            semgrep-output.txt

  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate requirements.txt for Trivy
        run: pip install -e ".[dev]" --quiet && pip freeze > requirements.txt

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          format: table
          output: trivy-report.txt
          exit-code: "1"

      - name: Write Trivy summary
        if: always()
        run: |
          {
            echo "## Trivy Scan Results (vuln, secret, misconfig)"
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload Trivy report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  zap:
    name: ZAP DAST Baseline Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install . --quiet

      - name: Start application
        run: |
          uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            echo "Waiting for server... ($i)"
            sleep 2
          done

      - name: Wait for initial data scrape
        run: |
          for i in $(seq 1 30); do
            count=$(curl -sf http://localhost:8000/api/v1/events | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
            [ "$count" -gt 0 ] && echo "Data ready ($count events)" && break
            echo "Waiting for scrape... ($i)"
            sleep 5
          done

      - name: Run ZAP Baseline Scan
        run: |
          mkdir -p reports
          # Rewrite target URL for CI (no host.docker.internal needed on Linux)
          sed 's|host\.docker\.internal|172.17.0.1|g' .zap/zap.yaml > .zap/zap-ci.yaml
          docker run --rm \
            -v ${{ github.workspace }}/.zap:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -autorun /zap/wrk/zap-ci.yaml || true
          # Copy reports from .zap/reports/ to workspace reports/
          cp -f .zap/reports/zap-report.* reports/ 2>/dev/null || true

      - name: Upload ZAP report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-report
          path: |
            reports/zap-report.*
            .zap/reports/zap-report.*

      - name: Write ZAP summary
        if: always()
        run: |
          if [ -f reports/zap-report.html ]; then
            echo "## ZAP DAST Baseline Results" >> $GITHUB_STEP_SUMMARY
            echo "See the uploaded **zap-report** artifact for full details." >> $GITHUB_STEP_SUMMARY
          fi
