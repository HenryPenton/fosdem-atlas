{% extends "base.html" %}

{% block content %}
<div class="container">
    <section class="hero">
        <h1>FOSDEM Explorer</h1>
        <p>Explore, search, and analyze the FOSDEM 2026 schedule</p>
    </section>

    <section class="search-section">
        <form hx-get="/api/events/search" hx-target="#results" hx-trigger="submit, keyup changed delay:300ms from:input">
            <input
                type="search"
                name="q"
                placeholder="Search talks, speakers, tracks..."
                autocomplete="off"
            >
            <button type="submit">Search</button>
        </form>
    </section>

    <section class="filters">
        <div hx-get="/api/tracks" hx-trigger="load" hx-target="this">
            Loading tracks...
        </div>
    </section>

    <section id="results" class="results">
        <div hx-get="/api/events" hx-trigger="load" hx-target="this">
            Loading schedule...
        </div>
    </section>
</div>
{% endblock %}
