{% extends "base.html" %}

{% block content %}
<div class="container">
    <section class="hero">
        <h1>FOSDEM Explorer</h1>
        <p>Explore the FOSDEM 2026 schedule</p>
        {% if event_count > 0 %}
        <p class="stats">{{ event_count }} events across {{ days|length }} days</p>
        {% endif %}
    </section>

    <section id="results" class="results">
        <div hx-get="/api/events" hx-trigger="load" hx-target="this">
            <div class="loading">Loading schedule...</div>
        </div>
    </section>
</div>
{% endblock %}
