{% if events %}
<div class="event-list">
    {% for event in events %}
    <div class="event-card">
        <h3>{{ event.title }}</h3>
        <div class="meta">
            <span class="time">{{ event.start_time.strftime('%H:%M') }}</span>
            <span class="room">📍 {{ event.room }}</span>
            <span class="duration">⏱️ {{ event.duration_minutes }} min</span>
        </div>
        <span class="track">{{ event.track }}</span>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="no-events">
    <p>No events found. Run <code>make scrape</code> to fetch the schedule.</p>
</div>
{% endif %}
