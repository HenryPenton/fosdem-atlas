{% extends "base.html" %}

{% block title %}FOSDEM Explorer — Not Found{% endblock %}

{% block content %}
<div class="container">
    <section class="hero">
        <div class="hero-icon">🔍</div>
        <h1>Not found</h1>
        <p class="hero-subtitle">{{ message }}</p>
        <a href="{{ back_url | default('/') }}" class="sort-btn sort-btn--active back-btn">
            ← {{ back_label | default('Back to schedule') }}
        </a>
    </section>
</div>
{% endblock %}
