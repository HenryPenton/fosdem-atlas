{% extends "base.html" %}

{% block content %}
<div class="container">
    <nav class="breadcrumb">
        <a href="/">Schedule</a> <span class="sep">&rsaquo;</span> <span>Tracks</span>
    </nav>

    <section class="hero">
        <div class="hero-icon">🎤</div>
        <h1>Tracks</h1>
        <p class="hero-subtitle">{{ tracks|length }} track{{ 's' if tracks|length != 1 }} across the conference</p>
    </section>

    <section class="track-list">
        {% for track in tracks %}
        <a href="/track/{{ track }}" class="track-card">
            <div class="track-info">
                <h3>{{ track }}</h3>
                <span class="track-count">{{ track_events[track] }} talk{{ 's' if track_events[track] != 1 }}</span>
            </div>
            <span class="track-arrow">&rarr;</span>
        </a>
        {% endfor %}
    </section>
</div>
{% endblock %}
