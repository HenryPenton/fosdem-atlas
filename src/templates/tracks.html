{% extends "base.html" %}

{% block content %}
<div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
        <ol class="breadcrumb-list">
            <li><a href="/">Schedule</a></li>
            <li><span>Tracks</span></li>
        </ol>
    </nav>

    <section class="hero">
        <div class="hero-icon">🎤</div>
        <h1>Tracks</h1>
        <p class="hero-subtitle" id="tracks-count">{{ tracks|length }} track{{ 's' if tracks|length != 1 }} across the conference</p>
    </section>

    <div class="filter-bar">
        <input
            type="search"
            id="track-filter"
            class="search-input"
            placeholder="Filter by name…"
            aria-label="Filter tracks by name"
            autocomplete="off"
        >
    </div>

    <section class="track-list" id="tracks-list">
        {% for track in tracks %}
        <a href="/track/{{ track | urlencode_path }}" class="track-card" data-name="{{ track | lower }}">
            <div class="track-info">
                <span class="track-name">{{ track }}</span>
                <span class="track-count">{{ track_events[track] }} talk{{ 's' if track_events[track] != 1 }}</span>
            </div>
            <span class="track-arrow">&rarr;</span>
        </a>
        {% endfor %}
    </section>
</div>
{% endblock %}
