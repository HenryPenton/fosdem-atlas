{% extends "base.html" %}

{% block content %}
<div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
        <ol class="breadcrumb-list">
            <li><a href="/">Schedule</a></li>
            <li><span>{{ day }}</span></li>
        </ol>
    </nav>

    <section class="hero">
        <div class="hero-icon">📅</div>
        <h1>{{ day }}</h1>
        <p class="hero-subtitle">{{ tracks|length }} tracks available</p>
    </section>

    <section class="track-list">
        {% for track in tracks %}
        <a href="/day/{{ day }}/track/{{ track | urlencode_path }}" class="track-card">
            <div class="track-info">
                <span class="track-name">{{ track }}</span>
                <span class="track-count">{{ track_events[track] }} talk{{ 's' if track_events[track] != 1 }}</span>
            </div>
            <span class="track-arrow">&rarr;</span>
        </a>
        {% endfor %}
    </section>
</div>
{% endblock %}
