<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ title }}{% endblock %}</title>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="/static/css/style.css">

    {% block head %}{% endblock %}
</head>
<body hx-boost="true">
    <header>
        <nav>
            <div class="nav-brand">
                <a href="/">🎪 FOSDEM Explorer</a>
            </div>
            <div class="nav-links">
                <a href="/speakers">Speakers</a>
                <a href="/tracks">Tracks</a>
                <a href="/analytics">Analytics</a>
                <a href="/my-schedule" class="nav-schedule">⭐ My Schedule <span id="schedule-badge" class="schedule-badge" hidden></span></a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>
            Schedule data © <a href="https://fosdem.org" target="_blank" rel="noopener">FOSDEM</a>,
            licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>
        </p>
        <p>
            <a href="https://github.com/HenryPenton/fosdem-explorer" target="_blank" rel="noopener">Source Code</a> ·
            MIT License
        </p>
    </footer>

    <script src="/static/js/my-schedule.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
