<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a56db">
    <title>{% block title %}{{ title }}{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

    <!-- Apply saved theme before first paint to avoid flash -->
    <script>
        (function () {
            var t = localStorage.getItem('fosdem_theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <!-- HTMX -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
            integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
            crossorigin="anonymous"
            defer></script>

    <!-- Theme flash prevention — must be inline to run synchronously before first paint -->

    <!-- Styles -->
    <link rel="stylesheet" href="/static/css/style.css">

    {% block head %}{% endblock %}
</head>
<body hx-boost="true">
    <header>
        <nav>
            <div class="nav-brand">
                <a href="/">🎪 FOSDEM Explorer</a>
            </div>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
            </button>
            <div class="nav-links" id="nav-links">
                <a href="/speakers">Speakers</a>
                <a href="/tracks">Tracks</a>
                <a href="/analytics">Analytics</a>
                <a href="/my-schedule" class="nav-schedule"><svg class="bookmark-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg> My Schedule <span id="schedule-badge" class="schedule-badge" hidden></span></a>
                <button class="dark-mode-toggle" id="dark-mode-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>
            Schedule data © <a href="https://fosdem.org" target="_blank" rel="noopener">FOSDEM</a>,
            licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>
        </p>
        <p>
            <a href="https://github.com/HenryPenton/fosdem-explorer" target="_blank" rel="noopener">Source Code</a> ·
            MIT License
        </p>
    </footer>

    <div class="toast-container" id="toast-container" aria-live="polite"></div>

    <!-- PWA install banner -->
    <div id="pwa-install-banner" class="pwa-install-banner" hidden>
        <span>📲 Install FOSDEM Explorer for offline access</span>
        <div class="pwa-install-actions">
            <button id="pwa-install-btn" class="pwa-install-accept">Install</button>
            <button id="pwa-dismiss-btn" class="pwa-install-dismiss" aria-label="Dismiss">✕</button>
        </div>
    </div>

    <script type="module" src="/static/js/my-schedule.js"></script>
    <script type="module" src="/static/js/base.js"></script>
    <script type="module" src="/static/js/copy-code.js"></script>
    <script type="module" src="/static/js/tracks.js"></script>
    <script type="module" src="/static/js/speakers.js"></script>
    <script type="module" src="/static/js/analytics.js"></script>
    <script type="module" src="/static/js/my-schedule-page.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
