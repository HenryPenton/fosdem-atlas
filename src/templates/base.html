<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a56db">
    <title>{% block title %}{{ title }}{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

    <!-- Apply saved theme before first paint to avoid flash -->
    <script>
        (function () {
            var t = localStorage.getItem('fosdem_theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="/static/css/style.css">

    {% block head %}{% endblock %}
</head>
<body hx-boost="true">
    <header>
        <nav>
            <div class="nav-brand">
                <a href="/">🎪 FOSDEM Explorer</a>
            </div>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
            </button>
            <div class="nav-links" id="nav-links">
                <a href="/speakers">Speakers</a>
                <a href="/tracks">Tracks</a>
                <a href="/analytics">Analytics</a>
                <a href="/my-schedule" class="nav-schedule"><svg class="bookmark-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg> My Schedule <span id="schedule-badge" class="schedule-badge" hidden></span></a>
                <button class="dark-mode-toggle" id="dark-mode-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>
            Schedule data © <a href="https://fosdem.org" target="_blank" rel="noopener">FOSDEM</a>,
            licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>
        </p>
        <p>
            <a href="https://github.com/HenryPenton/fosdem-explorer" target="_blank" rel="noopener">Source Code</a> ·
            MIT License
        </p>
    </footer>

    <div class="toast-container" id="toast-container" aria-live="polite"></div>

    <!-- PWA install banner -->
    <div id="pwa-install-banner" class="pwa-install-banner" hidden>
        <span>📲 Install FOSDEM Explorer for offline access</span>
        <div class="pwa-install-actions">
            <button id="pwa-install-btn" class="pwa-install-accept">Install</button>
            <button id="pwa-dismiss-btn" class="pwa-install-dismiss" aria-label="Dismiss">✕</button>
        </div>
    </div>

    <script src="/static/js/my-schedule.js"></script>
    <script>
        // Dark mode toggle
        (function () {
            var btn = document.getElementById('dark-mode-toggle');
            function applyTheme(dark) {
                if (dark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    btn.textContent = '☀️';
                    btn.title = 'Switch to light mode';
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    btn.textContent = '🌙';
                    btn.title = 'Switch to dark mode';
                }
            }
            var saved = localStorage.getItem('fosdem_theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            applyTheme(saved === 'dark' || (!saved && prefersDark));
            btn.addEventListener('click', function () {
                var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                localStorage.setItem('fosdem_theme', isDark ? 'light' : 'dark');
                applyTheme(!isDark);
            });
        })();

        // Mobile nav toggle
        (function () {
            var toggle = document.getElementById('nav-toggle');
            var links = document.getElementById('nav-links');
            toggle.addEventListener('click', function () {
                var open = links.classList.toggle('nav-open');
                toggle.classList.toggle('nav-open', open);
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            });
        })();

        // Toast notification helper
        function showToast(message, type) {
            var container = document.getElementById('toast-container');
            var toast = document.createElement('div');
            toast.className = 'toast' + (type === 'success' ? ' toast--success' : '');
            toast.textContent = message;
            container.appendChild(toast);
            requestAnimationFrame(function () {
                requestAnimationFrame(function () { toast.classList.add('toast--visible'); });
            });
            setTimeout(function () {
                toast.classList.remove('toast--visible');
                setTimeout(function () { toast.remove(); }, 300);
            }, 4000);
        }

        // HTMX error handling
        document.addEventListener('htmx:responseError', function (e) {
            showToast('Request failed (' + e.detail.xhr.status + '). Please try again.', 'error');
        });
        document.addEventListener('htmx:sendError', function () {
            showToast('Network error. Check your connection and try again.', 'error');
        });

        // Service Worker registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/static/sw.js', { scope: '/' }).catch(function () {});
            });
        }

        // PWA install prompt
        (function () {
            var deferred = null;
            var banner = document.getElementById('pwa-install-banner');
            var installBtn = document.getElementById('pwa-install-btn');
            var dismissBtn = document.getElementById('pwa-dismiss-btn');

            if (localStorage.getItem('fosdem_pwa_dismissed')) return;

            window.addEventListener('beforeinstallprompt', function (e) {
                e.preventDefault();
                deferred = e;
                banner.hidden = false;
            });

            if (installBtn) {
                installBtn.addEventListener('click', function () {
                    banner.hidden = true;
                    if (deferred) {
                        deferred.prompt();
                        deferred.userChoice.then(function () { deferred = null; });
                    }
                });
            }

            if (dismissBtn) {
                dismissBtn.addEventListener('click', function () {
                    banner.hidden = true;
                    localStorage.setItem('fosdem_pwa_dismissed', '1');
                });
            }
        })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
