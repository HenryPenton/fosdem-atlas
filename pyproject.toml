[project]
name = "fosdem-explorer"
version = "1.1.0"
description = "A DuckDB-powered web application for exploring and analyzing the FOSDEM schedule"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Henry Penton" }
]
keywords = ["fosdem", "conference", "schedule", "duckdb", "htmx"]

dependencies = [
    "fastapi==0.135.1",
    "uvicorn[standard]==0.42.0",
    "duckdb==1.5.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "python-multipart==0.0.22",
    "lxml==6.0.2",
    "apscheduler==3.11.2",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "yake==0.7.3",
    "slowapi==0.1.9",
    "nh3==0.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
    "pre-commit",
    "mypy",
    "lxml-stubs",
    "pip-audit",
    "commitizen",
    "cyclonedx-bom",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["src", "db", "scraper"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apscheduler", "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yake", "yake.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["slowapi", "slowapi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing -n auto"

[tool.commitizen]
version_provider = "pep621"
update_changelog_on_bump = true
tag_format = "v$version"
changelog_incremental = true
