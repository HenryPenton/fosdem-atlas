[project]
name = "fosdem-explorer"
version = "0.1.0"
description = "A DuckDB-powered web application for exploring and analyzing the FOSDEM schedule"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Henry Penton" }
]
keywords = ["fosdem", "conference", "schedule", "duckdb", "htmx"]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "duckdb",
    "httpx",
    "jinja2",
    "python-multipart",
    "lxml",
    "apscheduler",
    "pydantic",
    "pydantic-settings",
]

[project.scripts]
fosdem-explorer = "src.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "pre-commit",
    "mypy",
    "lxml-stubs",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apscheduler", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
